<!doctype html>
<html lang="en" class="dark">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<title>Yann Amsellem</title>
		<meta
			name="description"
			content="Yann Amsellem — Senior Software Engineer architecting distributed systems, real-time analytics platforms, and high-performance client applications."
		/>
		<script>
			(function () {
				try {
					var saved = localStorage.getItem('theme');
					if (saved === 'light') {
						document.documentElement.classList.remove('dark');
					} else if (saved === 'dark') {
						document.documentElement.classList.add('dark');
					}
				} catch (e) {}
			})();
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div id="root" style="height: 100%">%sveltekit.body%</div>
	</body>
</html>
