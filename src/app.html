<!doctype html>
<html lang="en" class="dark">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<title>Yann Amsellem</title>
		<meta
			name="description"
			content="Yann Amsellem — Senior Software Engineer architecting distributed systems, real-time analytics platforms, and high-performance client applications."
		/>
		<script>
			(function () {
				try {
					var saved = localStorage.getItem('theme');
					if (saved === 'light') {
						document.documentElement.classList.remove('dark');
					} else {
						document.documentElement.classList.add('dark');
					}
				} catch (e) {}
			})();
		</script>
		%sveltekit.head%
	</head>
	<body
		data-sveltekit-preload-data="hover"
		class="min-h-screen bg-[#fafafa] text-[#1a1a1a] antialiased transition-colors duration-150 dark:bg-[#121212] dark:text-[#e5e5e5]"
	>
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
